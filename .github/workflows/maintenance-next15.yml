name: Validate Next.js 15 maintenance upgrade

on:
  push:
    branches:
      - maintenance/2026-09-digital-nomad-wiki

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/2026-09-digital-nomad-wiki

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Normalize legacy registry URLs
        shell: bash
        run: |
          sed -i 's#https://registry.yarnpkg.com/#https://registry.npmjs.org/#g' yarn.lock
          yarn config set registry https://registry.npmjs.org
          echo 'Resolved download hosts:'
          grep -E '^[[:space:]]+resolved "https://' yarn.lock \
            | sed -E 's#.*https://([^/]+)/.*#\1#' \
            | sort -u

      - name: Install dependencies and refresh lockfile
        run: yarn install --no-progress

      - name: Build production bundle
        run: yarn build

      - name: Commit updated lockfile
        shell: bash
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore: sync yarn lock for Next.js 15"
          git push origin HEAD:maintenance/2026-09-digital-nomad-wiki
